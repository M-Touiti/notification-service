name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and run unit tests
        run: mvn clean install -DskipTests

      - name: Run unit tests (domain + application)
        run: mvn test -pl domain,application

      - name: Run integration tests (exposition — requires Docker)
        run: mvn verify -pl exposition
