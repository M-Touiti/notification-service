<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Password Reset</title>
<style>body{font-family:-apple-system,sans-serif;background:#f4f6f8;margin:0}.container{max-width:560px;margin:40px auto;background:#fff;border-radius:8px;overflow:hidden}.header{background:#e3a008;color:#fff;padding:32px 40px}.body{padding:40px;color:#374151}.btn{display:inline-block;background:#e3a008;color:#fff;padding:14px 32px;border-radius:6px;text-decoration:none;font-weight:600;margin-top:24px}.footer{background:#f9fafb;padding:24px 40px;text-align:center;color:#9ca3af;font-size:12px}</style>
</head>
<body>
<div class="container">
  <div class="header"><h1 style="margin:0">🔑 Password Reset Request</h1></div>
  <div class="body">
    <p>Hi <strong th:text="${name ?: 'there'}">there</strong>,</p>
    <p>We received a request to reset your password. Click the button below to proceed.</p>
    <p>This link expires in <strong th:text="${expiresIn ?: '30'}">30</strong> minutes.</p>
    <div style="text-align:center"><a class="btn" th:href="${resetLink ?: '#'}" href="#">Reset Password</a></div>
    <p style="margin-top:24px;color:#6b7280;font-size:14px">If you didn't request this, you can safely ignore this email. Your password will not be changed.</p>
  </div>
  <div class="footer"><p>&copy; 2025 Demo Platform.</p></div>
</div>
</body></html>
